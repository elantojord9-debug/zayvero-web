<style>
/* ================= BASE ================= */

html{scroll-behavior:smooth}

/* --- Barra fija de DEMO (obligatoria en los 5 estilos) --- */

.style-switch p{font-size:13px;opacity:.75;margin-bottom:14px}
.style-switch .sw{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.style-switch .sw a.on{background:#f59e0b;border-color:#f59e0b;color:#1a1a1a}
.stars{color:#f59e0b;letter-spacing:3px;font-size:15px}

/* ============================================================
   ESTILO 1 — MODERNO (dark tech, hero full-screen con foto)
============================================================ */

/* ============ HELPERS (XSS: todo texto via textContent) ============ */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function img(src, alt){
  const i = document.createElement("img");
  i.src = IMG + src; i.alt = alt || ""; i.loading = "lazy";
  return i;
}
function demoBtn(label, cls){
  const b = document.createElement("button");
  b.type = "button"; b.className = cls || ""; b.textContent = label;
  b.addEventListener("click", openModal);
  return b;
}
function stars(){
  const s = el("div","stars"); s.textContent = "★★★★★"; s.setAttribute("aria-label","5 estrellas");
  return s;
}
function ejemploTag(){
  const t = el("span","ejemplo-tag","Ejemplo"); return t;
}
function switcher(actual){
  const d = el("div","style-switch");
  d.appendChild(el("p",null,"¿Te gusta otro estilo? Míralos todos:"));
  const w = el("div","sw");
  const nombres = {1:"Moderno",2:"Elegante",3:"Minimalista",4:"Llamativo",5:"Clásico"};
  const q = new URLSearchParams(location.search);
  for (let e=1; e<=5; e++){
    const a = document.createElement("a");
    q.set("e", e); a.href = location.pathname + "?" + q.toString();
    a.textContent = nombres[e];
    if (e === actual) a.classList.add("on");
    w.appendChild(a);
  }
  d.appendChild(w);
  return d;
}
function openModal(){
  document.getElementById("demo-modal").classList.add("open");

  document.getElementById("demo-modal").classList.remove("open");

});

}

function renderModerno(root, T, nombre){
  const s = el("div","s1"); root.appendChild(s);
  // Nav fija con blur
  const nav = el("div","nav");
  const brand = el("div","brand");
  brand.appendChild(el("span","dot", nombre.trim().charAt(0).toUpperCase() || "N"));
  brand.appendChild(el("span",null,nombre));
  nav.appendChild(brand);
  const nb = demoBtn(T.cta,"btn sm"); nav.appendChild(nb);
  s.appendChild(nav);
  // Hero full-screen con foto
  const hero = el("div","hero");
  const bg = img(T.fotos[0], nombre); bg.className = "bg"; bg.loading = "eager";
  hero.appendChild(bg);
  hero.appendChild(el("div","shade"));
  const hin = el("div","in");
  hin.appendChild(el("span","kicker",T.etiqueta));
  hin.appendChild(el("h1",null,T.heroTitulo));
  hin.appendChild(el("p","sub",T.heroSub));
  const rev = el("div","revrow"); rev.appendChild(stars());
  rev.appendChild(el("span",null,"4.9 · +500 reseñas en Google"));
  hin.appendChild(rev);
  const ctas = el("div","ctas");
  ctas.appendChild(demoBtn("💬 "+T.cta+" por WhatsApp","btn"));
  const ghost = demoBtn("Ver servicios","btn ghost");
  ghost.addEventListener("click",()=>document.getElementById("s1-serv").scrollIntoView({behavior:"smooth"}));
  ctas.appendChild(ghost);
  hin.appendChild(ctas);
  hero.appendChild(hin); s.appendChild(hero);
  // Stats
  const stats = el("div","stats");
  T.stats.forEach(st=>{ const d=el("div"); d.appendChild(el("b",null,st[0])); d.appendChild(el("span",null,st[1])); stats.appendChild(d); });
  s.appendChild(stats);
  // Servicios: tarjetas con foto
  const sec = el("section"); sec.id = "s1-serv";
  sec.appendChild(el("h2","st","Nuestros servicios"));
  sec.appendChild(el("p","ss","Todo lo que necesitas, en un solo lugar. Precios de ejemplo."));
  const cards = el("div","cards");
  T.servicios.forEach((sv,i)=>{
    const c = el("div","card");
    c.appendChild(img(T.fotos[i%T.fotos.length], sv.n));
    const cb = el("div","cb");
    cb.appendChild(el("h3",null,sv.n));
    cb.appendChild(el("p",null,sv.d));
    cb.appendChild(el("span","pr",sv.p));

  const root = document.getElementById("app");
  ({1:renderModerno,2:renderElegante,3:renderMinimalista,4:renderLlamativo,5:renderClasico})[e](root, T, nombre);
})();
