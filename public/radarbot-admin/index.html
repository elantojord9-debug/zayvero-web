<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RadarBot · Panel Admin</title>
<style>
  :root{
    --fondo:#0F172A; --tarjeta:#1E293B; --borde:#334155;
    --verde:#22C55E; --verde-osc:#16A34A; --rojo:#EF4444; --rojo-osc:#DC2626;
    --texto:#F1F5F9; --gris:#94A3B8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--fondo); color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 48px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  h1{font-size:22px; margin:0;}
  h1 .dot{color:var(--verde);}
  .priv{font-size:11px; color:var(--gris); border:1px dashed var(--borde);
    border-radius:8px; padding:6px 10px; margin-bottom:16px; text-align:center;}
  .card{background:var(--tarjeta); border:1px solid var(--borde); border-radius:14px;
    padding:16px; margin-bottom:12px;}
  label{display:block; font-size:13px; color:var(--gris); margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input{width:100%; background:#0B1220; border:1px solid var(--borde); color:var(--texto);
    border-radius:10px; padding:14px; font-size:16px;}
  input:focus{outline:none; border-color:var(--verde);}
  button{width:100%; border:none; border-radius:12px; padding:15px; font-size:16px;
    font-weight:700; cursor:pointer; margin-top:12px; min-height:52px;}
  .btn-p{background:var(--verde); color:#052e16;}
  .btn-p:active{background:var(--verde-osc);}
  .btn-danger{background:transparent; border:2px solid var(--rojo); color:var(--rojo);}
  .btn-ghost{background:transparent; border:2px solid var(--borde); color:var(--texto);}
  .btn-sm{width:auto; min-height:44px; padding:10px 14px; font-size:14px; margin-top:8px;
    margin-right:8px; display:inline-block;}
  button:disabled{opacity:.5;}
  .badge{display:inline-block; font-size:12px; font-weight:800; border-radius:999px;
    padding:4px 12px; letter-spacing:.5px;}
  .b-ok{background:rgba(34,197,94,.15); color:var(--verde); border:1px solid var(--verde);}
  .b-off{background:rgba(239,68,68,.15); color:var(--rojo); border:1px solid var(--rojo);}
  .cli-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .cli-user{font-size:17px; font-weight:700; word-break:break-all;}
  .cli-meta{color:var(--gris); font-size:13px; margin-top:8px; line-height:1.7;}
  .cli-meta b{color:var(--texto);}
  .vencida{color:var(--rojo); font-weight:700;}
  .nota{font-size:12px; color:var(--gris); font-style:italic;}
  .msg{border-radius:10px; padding:12px; margin-bottom:12px; font-size:14px; display:none;}
  .msg.ok{display:block; background:rgba(34,197,94,.12); border:1px solid var(--verde); color:#BBF7D0;}
  .msg.err{display:block; background:rgba(239,68,68,.12); border:1px solid var(--rojo); color:#FECACA;}
  .row-btns{margin-top:6px;}
  .topbar{display:flex; gap:8px; margin-bottom:12px;}
  .topbar button{margin-top:0; flex:1;}
  .hidden{display:none !important;}
  .hint{font-size:12px; color:var(--gris); margin-top:6px;}
  .spinner{text-align:center; color:var(--gris); padding:24px;}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>RadarBot <span class="dot">·</span> Panel Admin</h1></header>
  <div class="priv">🔒 URL privada — no compartir</div>
  <div id="msg" class="msg"></div>

  <!-- LOGIN -->
  <section id="sec-login" class="card">
    <label for="li-email">Email del administrador</label>
    <input id="li-email" type="email" autocomplete="username" placeholder="tu@email.com">
    <label for="li-pass">Contraseña</label>
    <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-p" id="btn-login" onclick="doLogin()">Entrar</button>
    <div class="hint">La sesión vive solo en esta pestaña. Al cerrarla se borra.</div>
  </section>

  <!-- PANEL -->
  <section id="sec-panel" class="hidden">
    <div class="topbar">
      <button class="btn-ghost btn-sm" onclick="cargarClientes()">↻ Actualizar</button>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Salir</button>
    </div>

    <div class="card">
      <b>＋ Crear cliente</b>
      <label for="nc-user">Usuario</label>
      <input id="nc-user" type="text" placeholder="ej: juan" autocapitalize="none">
      <div class="hint">Se crea como <b>usuario@viajebot.app</b>. Al crearlo se activan 12h de prueba gratis automáticamente.</div>
      <label for="nc-pass">Contraseña (mín. 6 caracteres)</label>
      <input id="nc-pass" type="password" placeholder="••••••••">
      <button class="btn-p" id="btn-crear" onclick="crearCliente()">Crear cliente</button>
    </div>

    <div id="lista"><div class="spinner">Cargando clientes…</div></div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://yypbbqwzoovvlxoxbfsb.supabase.co";
const ANON_KEY = "sb_publishable_b7qbigyZ1jrpXpKwaSwtHg_LylOxeTE";
const DOMINIO = "@viajebot.app";
let sesion = null; // solo en memoria, nunca en localStorage

const $ = id => document.getElementById(id);
const fmtRD = new Intl.DateTimeFormat("es-DO", {
  timeZone:"America/Santo_Domingo", day:"numeric", month:"short", year:"numeric",
  hour:"numeric", minute:"2-digit", hour12:true
});

function aviso(texto, tipo){
  const m = $("msg");
  m.textContent = texto;
  m.className = "msg " + (tipo || "");
  if(texto) setTimeout(()=>{ m.className="msg"; }, 6000);
}

async function api(metodo, ruta, cuerpo, conAuth){
  const headers = { "apikey": ANON_KEY, "Content-Type":"application/json" };
  if(conAuth && sesion) headers["Authorization"] = "Bearer " + sesion.access_token;
  const r = await fetch(SUPABASE_URL + ruta, {
    method: metodo, headers, body: cuerpo ? JSON.stringify(cuerpo) : undefined
  });
  let data = null;
  try { data = await r.json(); } catch(e){}
  return { ok:r.ok, status:r.status, data };
}

async function conSesion(fn){
  let res = await fn();
  if(res.status === 401 && sesion && sesion.refresh_token){
    // intenta refrescar el token una vez
    const rr = await api("POST", "/auth/v1/token?grant_type=refresh_token",
      { refresh_token: sesion.refresh_token }, false);
    if(rr.ok && rr.data.access_token){
      sesion.access_token = rr.data.access_token;
      if(rr.data.refresh_token) sesion.refresh_token = rr.data.refresh_token;
      res = await fn();
    } else {
      aviso("Sesión expirada. Inicia sesión de nuevo.", "err");
      doLogout(); return null;
    }
  }
  return res;
}

async function doLogin(){
  const email = $("li-email").value.trim();
  const password = $("li-pass").value;
  if(!email || !password){ aviso("Escribe tu email y contraseña.", "err"); return; }
  $("btn-login").disabled = true;
  const res = await api("POST", "/auth/v1/token?grant_type=password", { email, password }, false);
  $("btn-login").disabled = false;
  if(!res.ok){ aviso("No se pudo entrar. Revisa tu email y contraseña.", "err"); return; }
  sesion = { access_token: res.data.access_token, refresh_token: res.data.refresh_token };
  $("li-pass").value = "";
  $("sec-login").classList.add("hidden");
  $("sec-panel").classList.remove("hidden");
  aviso("");
  cargarClientes();
}

function doLogout(){
  sesion = null;
  $("sec-panel").classList.add("hidden");
  $("sec-login").classList.remove("hidden");
  $("lista").innerHTML = "";
  aviso("");
}

function estadoDe(c){
  const ahora = Date.now();
  const venceMs = c.vence ? new Date(c.vence).getTime() : 0;
  const vigente = c.activo && venceMs > ahora;
  return { vigente, venceMs,
    vencido: c.activo && venceMs && venceMs <= ahora };
}

function tarjeta(c){
  const e = estadoDe(c);
  const badge = e.vigente
    ? '<span class="badge b-ok">ACTIVO</span>'
    : '<span class="badge b-off">' + (e.vencido ? "VENCIDO" : "APAGADO") + "</span>";
  const venceTxt = c.vence
    ? fmtRD.format(new Date(c.vence))
    : "—";
  const venceHtml = (e.vencido || (!e.vigente && c.vence && e.venceMs <= Date.now()))
    ? '<span class="vencida">' + venceTxt + "</span>" : venceTxt;
  const btnToggle = e.vigente
    ? `<button class="btn-danger btn-sm" onclick="apagarCliente('${c.user_id}','${esc(c.usuario)}')">Apagar</button>`
    : `<button class="btn-p btn-sm" onclick="reactivarCliente('${c.user_id}','${esc(c.usuario)}')">Reactivar</button>`;
  return `<div class="card">
    <div class="cli-head"><span class="cli-user">${esc(c.usuario)}</span>${badge}</div>
    <div class="cli-meta">Vence: <b>${venceHtml}</b><br>
    ${c.nota ? '<span class="nota">Nota: ' + esc(c.nota) + "</span><br>" : ""}
    <span class="nota">ID: ${esc(String(c.user_id).slice(0,8))}…</span></div>
    <div class="row-btns">
      <button class="btn-p btn-sm" onclick="renovarCliente('${c.user_id}','${esc(c.usuario)}')">Renovar 30 días</button>
      ${btnToggle}
    </div>
  </div>`;
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

async function cargarClientes(){
  $("lista").innerHTML = '<div class="spinner">Cargando clientes…</div>';
  const res = await conSesion(() =>
    api("GET", "/rest/v1/licencias?select=user_id,usuario,activo,vence,nota&order=usuario.asc", null, true));
  if(res === null) return;
  if(!res.ok){ aviso("No se pudo cargar la lista (error " + res.status + ").", "err"); return; }
  const filas = res.data || [];
  if(!filas.length){ $("lista").innerHTML = '<div class="spinner">Sin clientes todavía.</div>'; return; }
  $("lista").innerHTML = filas.map(tarjeta).join("");
}

async function crearCliente(){
  let u = $("nc-user").value.trim().toLowerCase();
  const pass = $("nc-pass").value;
  if(!u){ aviso("Escribe el nombre de usuario.", "err"); return; }
  if(!u.includes("@")) u = u + DOMINIO;
  if(pass.length < 6){ aviso("La contraseña debe tener al menos 6 caracteres.", "err"); return; }
  $("btn-crear").disabled = true;
  // signup: solo apikey, sin Authorization (no debe heredar la sesión del admin)
  const res = await api("POST", "/auth/v1/signup", { email:u, password:pass }, false);
  $("btn-crear").disabled = false;
  if(!res.ok){
    const d = (res.data && (res.data.msg || res.data.message)) || "";
    aviso("No se pudo crear: " + (d || ("error " + res.status)), "err");
    return;
  }
  $("nc-user").value = ""; $("nc-pass").value = "";
  aviso("✅ Cliente creado: " + u + " — prueba gratis de 12h activada.", "ok");
  setTimeout(cargarClientes, 2000);
}

async function renovarCliente(user_id, usuario){
  const vence = new Date(Date.now() + 30*24*3600*1000).toISOString();
  const res = await conSesion(() =>
    api("PATCH", "/rest/v1/licencias?user_id=eq." + encodeURIComponent(user_id),
      { activo:true, vence }, true));
  if(res === null) return;
  if(!res.ok){ aviso("No se pudo renovar (error " + res.status + ").", "err"); return; }
  aviso("✅ " + usuario + " renovado hasta el " + fmtRD.format(new Date(vence)) + ".", "ok");
  cargarClientes();
}

async function apagarCliente(user_id, usuario){
  if(!confirm("¿Seguro que quieres APAGAR el servicio a " + usuario + "?\n\nEl bot dejará de funcionarle de inmediato.")) return;
  const res = await conSesion(() =>
    api("PATCH", "/rest/v1/licencias?user_id=eq." + encodeURIComponent(user_id),
      { activo:false }, true));
  if(res === null) return;
  if(!res.ok){ aviso("No se pudo apagar (error " + res.status + ").", "err"); return; }
  aviso("⛔ Servicio apagado a " + usuario + ".", "ok");
  cargarClientes();
}

async function reactivarCliente(user_id, usuario){
  const res = await conSesion(() =>
    api("PATCH", "/rest/v1/licencias?user_id=eq." + encodeURIComponent(user_id),
      { activo:true }, true));
  if(res === null) return;
  if(!res.ok){ aviso("No se pudo reactivar (error " + res.status + ").", "err"); return; }
  aviso("✅ Servicio reactivado a " + usuario + ".", "ok");
  cargarClientes();
}
</script>
</body>
</html>
